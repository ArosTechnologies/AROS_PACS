{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña - MedCloud</title>
    
    
    
    
    
</head>

<body>
    <div>
        <div>
            <div>
                <div>
                    <img src="{% static 'core/assets/img/logos/medCloud_logo.png' %}" 
                        alt="MedCloud Logo">
                    <h2>Recuperar Contraseña</h2>
                    <p>Ingresa tu correo electrónico y te enviaremos un
                        enlace para restablecer tu contraseña.</p>
                </div>

                <form method="post">
                    {% csrf_token %}

                    {% if form.errors %}
                    <div>
                        Por favor revisa que el correo sea válido.
                    </div>
                    {% endif %}

                    <div>
                        <label for="id_email">Correo Electrónico</label>
                        <input type="email" name="email"  placeholder="ejemplo@correo.com" required
                            id="id_email">
                    </div>

                    <button type="submit">
                        Enviar enlace de recuperación
                    </button>

                    <div>
                        <a href="{% url 'login' %}">
                            ← Volver al inicio de sesión
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>

</html>
