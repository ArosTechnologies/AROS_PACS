version: '3.8'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-aros_clinic}
      POSTGRES_USER: ${DB_USER:-aros_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aros_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  orthanc:
    build: .
    ports:
      - "8042:8042" # HTTP REST API & Web GUI
      - "4242:4242" # DICOM port
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-aros_clinic}
      DB_USER: ${DB_USER:-aros_user}
      DB_PASSWORD: ${DB_PASSWORD:-aros_password}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - orthanc_db:/var/lib/orthanc/db

volumes:
  pgdata:
  orthanc_db:
